  .actions {width:100%}
  .actions button {flex:1}

<body>
<main class="wrap" id="app">

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
"use strict";

// GOOGLE APPS SCRIPT
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby-ywy1Zqj0x8dXs35ry09gd6G5p7VhUMQYWKmTvOb4HnrpO19B2TlK-aSeqy7MT7pq/exec";

const STATES = {
  vic:"VIC",
  wa:"WA",
  nsw:"NSW",
  qld:"QLD",
  act:"ACT"
};

const NAMES = {
  mopbuc:"Mop Bucket",
  vac:"Vacuum Cleaner",
  winkit:"Window Kit (Squeegee, Applicator, Bucket)",
  scrub:"Scrubber",
  presswash:"Pressure Washer",
  polyvac:"Polyvac"
};

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);

// UTILITY FUNCTIONS
function el(tag,text="",className="") {
  const node=document.createElement(tag);
  node.textContent=text;
  if(className) node.className=className;
  return node;
}

function notice(node,message,type="info") {
  node.className="notice "+type;
  node.textContent=message;
  node.hidden=false;
}

function formatDate(value) {
  const date=new Date(value);
  return isNaN(date.getTime())
    ? String(value||"")
    : date.toLocaleString();
}

function wait(ms) {
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function getJSON(action) {
  const url=new URL(SCRIPT_URL);
  url.searchParams.set("action",action);
  url.searchParams.set("_",Date.now());

  const response=await fetch(url,{
    cache:"no-store"
  });

  if(!response.ok) {
    throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  if(data.success===false) {
    throw new Error(data.message||"Spreadsheet error");
  }

  return data;
}

// EQUIPMENT QR CODE PARSING
function parseCode(raw,stateParam="",equipmentParam="") {
  if(typeof raw!=="string") return null;

  const code=raw.trim().toLowerCase();
  const parts=code.split("_");

  if(
    parts.length===3 &&
    STATES[parts[0]] &&
    NAMES[parts[1]] &&
    /^\d+$/.test(parts[2])
  ) {
    return {
      state:STATES[parts[0]],
      equipmentName:NAMES[parts[1]],
      equipmentCode:code
    };
  }

  const state=String(stateParam).toUpperCase();
  const equipmentName=String(equipmentParam).trim();

  if(
    Object.values(STATES).includes(state) &&
    equipmentName &&
    equipmentName.length<=70 &&
    /^[a-z0-9_-]{3,85}$/.test(code)
  ) {
    return {
      state,
      equipmentName,
      equipmentCode:code
    };
  }

  return null;
}

function resolveQR(raw) {
  const value=String(raw||"").trim();
  if(!value) return null;

  let code=value;
  let state="";
  let equipment="";

  try {
    const url=new URL(value);

    if(
      url.protocol!=="https:" ||
      url.hostname!=="leparfait.vercel.app"
    ) return null;

    code=url.searchParams.get("code")||"";
    state=url.searchParams.get("state")||"";
    equipment=url.searchParams.get("equipment")||"";
  } catch(_) {
    // Treat input as a plain equipment code.
  }

  const info=parseCode(code,state,equipment);
  if(!info) return null;

  return {code:info.equipmentCode,state,equipment};
}

function openEquipment(info) {
  const url=new URL(location.pathname,location.origin);
  url.searchParams.set("code",info.code);

  if(info.state) url.searchParams.set("state",info.state);
  if(info.equipment) url.searchParams.set("equipment",info.equipment);

  location.assign(url.toString());
}

// EQUIPMENT HISTORY
function getHistory(rows,code) {
  return rows.filter(row=>
    String(row.equipmentCode||"")
      .trim().toLowerCase()===code.toLowerCase()
  );
}

function latestByCode(rows) {
  const map=new Map();

  for(const row of rows) {
    const code=String(row.equipmentCode||"")
      .trim().toLowerCase();

    if(code) map.set(code,row);
  }

  return [...map.values()].reverse();
}

function renderHistory(container,code,history) {
  container.replaceChildren();

  const heading=el("div","","row");
  heading.append(el("strong","Scan History — "+code));

  const close=el("button","Close","secondary");
  close.onclick=()=>container.hidden=true;
  heading.append(close);

  container.append(heading);

  if(!history.length) {
    container.append(el("p","No saved history."));
    container.hidden=false;
    return;
  }

  container.append(
    el("p",history.length+" saved assignment(s)","pill")
  );

  const wrap=el("div","","tablewrap");
  const table=el("table");
  const head=el("thead");
  const tr=el("tr");

  ["Site","State","Logged At"].forEach(name=>
    tr.append(el("th",name))
  );

  head.append(tr);
  table.append(head);

  const body=el("tbody");

  [...history].reverse().forEach((row,index)=>{
    const tr=el("tr");

    [
      row.site,
      row.state,
      formatDate(row.timestamp)
    ].forEach(value=>tr.append(el("td",String(value||""))));

    if(index===0) tr.style.fontWeight="600";
    body.append(tr);
  });

  table.append(body);
  wrap.append(table);
  container.append(wrap);
  container.hidden=false;
}

// DASHBOARD
async function showDashboard() {
  app.innerHTML=`
    <div class="row" style="margin-bottom:20px">
      <div>
        <h1>Equipment Site Log</h1>
        <p class="sub" style="margin-bottom:0">
          Latest equipment locations and complete scan history.
        </p>
      </div>

      <a class="button-link" href="?view=add">
        + Add New Equipment
      </a>
    </div>

    <section class="card">
      <div class="pill" id="count">Loading entries...</div>

      <div class="grid2">
        <div>
          <label for="stateFilter">Filter by state</label>
          <select id="stateFilter">
            <option value="">All states</option>
          </select>
        </div>

        <div>
          <label for="search">Search site or equipment</label>
          <input id="search" type="search"
                 placeholder="Search entries...">
        </div>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Equipment Code</th>
              <th>State</th>
              <th>Site</th>
              <th>Equipment Name</th>
              <th>Logged At</th>
            </tr>
          </thead>

          <tbody id="rows">
            <tr>
              <td colspan="5" class="empty">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="historyPanel"
           class="history-panel" hidden></div>

      <div class="bottom-actions">
        <div class="actions">
          <button id="refreshBtn" class="secondary">
            Refresh
          </button>
          <button id="exportBtn" disabled>
            Export to Excel
          </button>
        </div>
      </div>

      <div id="dashboardNotice" hidden></div>
    </section>

    <p class="footer">
      Each equipment item appears once at its latest saved site.
      Click an equipment code to view its complete history.
    </p>
  `;

  const stateFilter=document.getElementById("stateFilter");
  const search=document.getElementById("search");
  const tableBody=document.getElementById("rows");
  const count=document.getElementById("count");
  const historyPanel=document.getElementById("historyPanel");
  const refreshBtn=document.getElementById("refreshBtn");
  const exportBtn=document.getElementById("exportBtn");
  const errorBox=document.getElementById("dashboardNotice");

  Object.values(STATES).forEach(state=>{
    const option=el("option",state);
    option.value=state;
    stateFilter.append(option);
  });

  let records=[];
  let loaded=false;

  function filtered() {
    const state=stateFilter.value;
    const term=search.value.trim().toLowerCase();

    return latestByCode(records).filter(row=>
      (!state||row.state===state) &&
      (!term||[
        row.equipmentCode,
        row.site,
        row.equipmentName,
        row.state
      ].some(value=>
        String(value||"").toLowerCase().includes(term)
      ))
    );
  }

  function repaint() {
    const selected=filtered();
    const total=latestByCode(records).length;

    count.textContent=
      `${selected.length} of ${total} equipment items `+
      `(${records.length} total saved assignments)`;

    tableBody.replaceChildren();

    if(!selected.length) {
      const tr=el("tr");
      const td=el("td","No equipment entries found.","empty");
      td.colSpan=5;
      tr.append(td);
      tableBody.append(tr);
    }

    selected.forEach(row=>{
      const tr=el("tr");
      const codeCell=el("td");

      const codeBtn=el(
        "button",
        String(row.equipmentCode||""),
        "code-link"
      );

      codeBtn.onclick=()=>{
        renderHistory(
          historyPanel,
          String(row.equipmentCode),
          getHistory(records,String(row.equipmentCode))
        );
        historyPanel.scrollIntoView({
          behavior:"smooth",
          block:"nearest"
        });
      };

      codeCell.append(codeBtn);
      tr.append(codeCell);

      [
        row.state,
        row.site,
        row.equipmentName,
        formatDate(row.timestamp)
      ].forEach(value=>tr.append(el("td",String(value??""))));

      tableBody.append(tr);
    });

    exportBtn.disabled=!loaded||!selected.length;
  }

  async function refresh() {
    refreshBtn.disabled=true;
    count.textContent="Loading entries...";
    historyPanel.hidden=true;
    errorBox.hidden=true;
    loaded=false;

    try {
      const response=await getJSON("logs");

      if(!Array.isArray(response.rows)) {
        throw new Error("Unexpected spreadsheet response");
      }

      records=response.rows;
      loaded=true;
      repaint();
    } catch(error) {
      records=[];
      repaint();
      notice(
        errorBox,
        "Could not load Google Sheets entries: "+error.message,
        "error"
      );
    } finally {
      refreshBtn.disabled=false;
    }
  }

  stateFilter.onchange=repaint;
  search.oninput=repaint;
  refreshBtn.onclick=refresh;

  exportBtn.onclick=()=>{
    if(typeof XLSX==="undefined") {
      notice(errorBox,"Excel library unavailable.","error");
      return;
    }

    const data=filtered().map(row=>({
      "Equipment Code":row.equipmentCode,
      "State":row.state,
      "Site":row.site,
      "Equipment Name":row.equipmentName,
      "Logged At":formatDate(row.timestamp)
    }));

    const worksheet=XLSX.utils.json_to_sheet(data);
    const workbook=XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      "Current Equipment"
    );

    XLSX.writeFile(
      workbook,
      "le_parfait_equipment_log.xlsx"
    );
  };

  await refresh();
}

// CAMERA SCANNER
function setupCameraScanner() {
  const open=document.getElementById("openScanner");
  const close=document.getElementById("closeScanner");
  const panel=document.getElementById("cameraPanel");
  const status=document.getElementById("cameraStatus");
  const manual=document.getElementById("manualQR");
  const manualBtn=document.getElementById("manualQRBtn");
  const message=document.getElementById("scannerMessage");

  let scanner=null;
  let scanning=false;
  let processing=false;

  function scanResult(text) {
    if(processing) return;

    const result=resolveQR(text);

    if(!result) {
      notice(
        message,
        "Unrecognized QR code. Please scan a Le Parfait equipment code.",
        "error"
      );
      return;
    }

    processing=true;

    if(status) status.textContent="Equipment found...";

    if(scanner&&scanning) {
      scanner.stop()
        .catch(()=>{})
        .finally(()=>openEquipment(result));
    } else {
      openEquipment(result);
    }
  }

  async function stopScanner() {
    if(scanner&&scanning) {
      try {await scanner.stop()} catch(_) {}
      scanning=false;
    }

    try {scanner?.clear()} catch(_) {}

    scanner=null;
    panel.hidden=true;
    open.hidden=false;
  }

  open.onclick=async()=>{
    panel.hidden=false;
    open.hidden=true;
    message.hidden=true;
    status.textContent="Requesting camera permission...";

    if(!window.isSecureContext) {
      status.textContent="Camera requires HTTPS.";
      return;
    }

    if(typeof Html5Qrcode==="undefined") {
      status.textContent="Scanner library unavailable.";
      return;
    }

    try {
      scanner=new Html5Qrcode(
        "scannerPreview",
        {verbose:false}
      );

      await scanner.start(
        {facingMode:"environment"},
        {
          fps:10,
          qrbox:{width:220,height:220}
        },
        scanResult,
        ()=>{}
      );

      scanning=true;
      status.textContent="Point the camera at an equipment QR code.";
    } catch(error) {
      status.textContent=
        "Unable to start camera: "+String(error.message||error);

      try {scanner?.clear()} catch(_) {}
      scanner=null;
    }
  };

  close.onclick=stopScanner;
  manualBtn.onclick=()=>scanResult(manual.value);

  manual.onkeydown=event=>{
    if(event.key==="Enter") scanResult(manual.value);
  };

  window.addEventListener(
    "pagehide",
    ()=>{
      if(scanner&&scanning) {
        scanner.stop().catch(()=>{});
      }
    },
    {once:true}
  );
}

// VERIFY A NEW SHEET RECORD
async function verifySave(info,site,previousCount) {
  for(let i=0;i<5;i++) {
    if(i>0) await wait(1400);

    try {
      const data=await getJSON("logs");
      if(!Array.isArray(data.rows)) continue;

      const matches=data.rows.filter(row=>
        String(row.equipmentCode||"").toLowerCase()===
          info.equipmentCode &&
        String(row.site||"").trim().toLowerCase()===
          site.toLowerCase()
      );

      if(matches.length>previousCount) return true;
    } catch(_) {}
  }

  return false;
}

// EQUIPMENT SITE ASSIGNMENT FORM
async function showScan() {
  const info=parseCode(
    params.get("code"),
    params.get("state"),
    params.get("equipment")
  );

  app.innerHTML=`
    <h1>Log Equipment</h1>
    <p class="sub">
      View the equipment's current location or assign a new site.
    </p>

    <section class="card" id="scanCard"></section>

    <a href="./">← Back to Dashboard</a>
  `;

  const card=document.getElementById("scanCard");

  if(!info) {
    card.textContent="Unrecognized equipment code.";
    return;
  }

  card.innerHTML=`
    <div class="pill">Equipment Code</div>
    <div class="code" id="equipmentCode"></div>

    <div class="grid2" style="margin-top:18px">
      <div>
        <div class="pill">State</div>
        <strong id="equipmentState"></strong>
      </div>

      <div>
        <div class="pill">Equipment</div>
        <strong id="equipmentName"></strong>
      </div>
    </div>

    <div class="current-site" id="currentSite">
      Checking current assigned site...
    </div>

    <div class="history-panel" id="scanHistory" hidden></div>

    <form id="logForm">
      <label for="site">Site Name</label>

      <input id="site"
             name="site"
             list="siteList"
             maxlength="150"
             autocomplete="off"
             placeholder="Enter site name"
             required>

      <datalist id="siteList"></datalist>

      <button class="full" id="submitBtn" type="submit">
        Save Site Assignment
      </button>
    </form>

    <div id="message" hidden></div>
  `;

  document.getElementById("equipmentCode").textContent=
    info.equipmentCode;
  document.getElementById("equipmentState").textContent=
    info.state;
  document.getElementById("equipmentName").textContent=
    info.equipmentName;

  const assignment=document.getElementById("currentSite");
  const historyPanel=document.getElementById("scanHistory");
  const form=document.getElementById("logForm");
  const message=document.getElementById("message");
  const button=document.getElementById("submitBtn");

  let currentSite="";
  let assignmentLoaded=false;
  let history=[];

  function displayAssignment() {
    assignment.replaceChildren();

    if(!history.length) {
      assignment.append(
        el("p","This equipment is not yet assigned.")
      );
      return;
    }

    const latest=history[history.length-1];

    assignment.append(
      el("span","Currently assigned to","pill"),
      el("strong",String(latest.site||"")),
      el(
        "span",
        "Last logged: "+formatDate(latest.timestamp),
        "pill"
      )
    );

    const historyBtn=el(
      "button",
      "View Scan History ("+history.length+")",
      "secondary"
    );

    historyBtn.style.marginTop="12px";

    historyBtn.onclick=()=>{
      renderHistory(
        historyPanel,
        info.equipmentCode,
        history
      );
    };

    assignment.append(historyBtn);
  }

  try {
    const data=await getJSON("logs");

    if(!Array.isArray(data.rows)) {
      throw new Error("Invalid response");
    }

    history=getHistory(data.rows,info.equipmentCode);
    assignmentLoaded=true;

    if(history.length) {
      currentSite=String(
        history[history.length-1].site||""
      ).trim();

      form.elements.site.value=currentSite;
    }

    displayAssignment();
  } catch(error) {
    assignment.textContent=
      "Could not load current assignment: "+error.message;
  }

  getJSON("sites").then(data=>{
    const list=document.getElementById("siteList");

    for(const site of (data.sites||[])) {
      if(typeof site==="string") {
        const option=el("option");
        option.value=site;
        list.append(option);
      }
    }
  }).catch(()=>{});

  form.onsubmit=async event=>{
    event.preventDefault();

    const site=form.elements.site.value.trim();

    if(!assignmentLoaded) {
      notice(
        message,
        "Cannot verify the current assignment. Check the spreadsheet connection.",
        "error"
      );
      return;
    }

    if(!site) return;

    if(
      currentSite &&
      currentSite.toLowerCase()===site.toLowerCase()
    ) {
      notice(
        message,
        "This equipment is already assigned to "+currentSite+
        ". Enter another site to record a transfer.",
        "info"
      );
      return;
    }

    button.disabled=true;
    button.textContent="Submitting...";
    message.hidden=true;

    try {
      const previousData=await getJSON("logs");
      const previousCount=previousData.rows.filter(row=>
        String(row.equipmentCode||"").toLowerCase()===
          info.equipmentCode &&
        String(row.site||"").trim().toLowerCase()===
          site.toLowerCase()
      ).length;

      await fetch(SCRIPT_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          state:info.state,
          site,
          equipmentName:info.equipmentName,
          equipmentCode:info.equipmentCode
        })
      });

      button.textContent="Verifying...";

      const verified=await verifySave(
        info,
        site,
        previousCount
      );

      if(verified) {
        currentSite=site;

        const updated=await getJSON("logs");
        history=getHistory(updated.rows,info.equipmentCode);

        displayAssignment();

        notice(
          message,
          "Equipment successfully assigned to "+site+".",
          "ok"
        );
      } else {
        notice(
          message,
          "Submission sent, but the spreadsheet could not be verified. Check Google Sheets before submitting again.",
          "info"
        );
      }
    } catch(error) {
      notice(
        message,
        "Submission could not be completed: "+error.message,
        "error"
      );
    } finally {
      button.disabled=false;
      button.textContent="Save Site Assignment";
    }
  };
}

// APP ROUTING
if(params.has("code")) {
  showScan();
} else if(params.get("view")==="add") {
  showAddEquipment();
} else {
  showDashboard();
}
</script>
</body>
</html>
