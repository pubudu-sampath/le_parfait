
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Le Parfait | Equipment Site Log</title>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --border: #e2e4e8;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --error: #b91c1c;
      --error-bg: #fee2e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171b;
        --card: #1e2126;
        --text: #e8eaed;
        --muted: #a4aab4;
        --border: #343942;
        --accent: #4f8cff;
        --accent-text: #0b1220;
        --ok: #86efac;
        --ok-bg: #103623;
        --error: #fca5a5;
        --error-bg: #451c22;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 24px 16px 48px;
    }

    .wrap {
      max-width: 820px;
      margin: auto;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 6px;
    }

    .sub {
      color: var(--muted);
      font-size: .92rem;
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #00000008;
    }

    .row {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .pill {
      color: var(--muted);
      font-size: .78rem;
    }

    .code {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      font: 600 1rem ui-monospace, Menlo, Consolas, monospace;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 6px;
    }

    label {
      display: block;
      font-size: .87rem;
      color: var(--muted);
      margin: 16px 0 7px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      padding: 12px;
    }

    button {
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-text);
      font: 600 .95rem system-ui;
      cursor: pointer;
      padding: 12px 16px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .full {
      width: 100%;
      margin-top: 18px;
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .notice {
      padding: 12px 14px;
      margin-top: 14px;
      border-radius: 9px;
      font-size: .92rem;
      line-height: 1.5;
    }

    .notice.ok {
      color: var(--ok);
      background: var(--ok-bg);
    }

    .notice.error {
      color: var(--error);
      background: var(--error-bg);
    }

    .notice.info {
      color: var(--text);
      background: var(--bg);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .tablewrap {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
    }

    th, td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    td.empty {
      text-align: center;
      color: var(--muted);
      padding: 25px;
    }

    .footer {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 18px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .grid2 {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="wrap" id="app">
    <h1>Equipment Site Log</h1>
    <p class="sub">Loading…</p>
  </main>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    defer>
  </script>

  <script>
    "use strict";

    // GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycby-ywy1Zqj0x8dXs35ry09gd6G5p7VhUMQYWKmTvOb4HnrpO19B2TlK-aSeqy7MT7pq/exec";

    // EQUIPMENT TYPES
    const NAMES = {
      mopbuc: "Mop Bucket",
      vac: "Vacuum Cleaner",
      winkit: "Window Kit (Squeegee, Applicator, Bucket)",
      scrub: "Scrubber",
      presswash: "Pressure Washer",
      polyvac: "Polyvac"
    };

    // AUSTRALIAN STATES
    const STATES = {
      vic: "VIC",
      wa: "WA",
      nsw: "NSW",
      qld: "QLD",
      act: "ACT"
    };

    const app = document.getElementById("app");

    const rawCode = new URLSearchParams(
      window.location.search
    ).get("code");

    // PARSE EQUIPMENT QR CODE
    function parseCode(raw) {
      if (typeof raw !== "string") return null;

      const code = raw.trim().toLowerCase();
      const parts = code.split("_");

      if (
        parts.length !== 3 ||
        !STATES[parts[0]] ||
        !NAMES[parts[1]] ||
        !/^\d+$/.test(parts[2])
      ) {
        return null;
      }

      return {
        state: STATES[parts[0]],
        equipmentName: NAMES[parts[1]],
        itemNumber: parts[2],
        equipmentCode: code
      };
    }

    // CREATE HTML ELEMENT SAFELY
    function element(tag, attrs = {}, text = "") {
      const el = document.createElement(tag);

      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value);
      }

      el.textContent = text;
      return el;
    }

    // SHOW STATUS MESSAGE
    function setNotice(node, message, kind = "info") {
      node.className = "notice " + kind;
      node.textContent = message;
      node.hidden = false;
    }

    // FORMAT DATE
    function formatDate(value) {
      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? String(value || "")
        : date.toLocaleString();
    }

    // READ DATA FROM GOOGLE SHEETS
    async function getJSON(action) {
      const url = new URL(SCRIPT_URL);

      url.searchParams.set("action", action);
      url.searchParams.set("_", String(Date.now()));

      const response = await fetch(url.toString(), {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      if (data.success === false) {
        throw new Error(
          data.message || "Spreadsheet error"
        );
      }

      return data;
    }

    // CHECK WHETHER AN ENTRY MATCHES
    function matchesLog(row, info, site) {
      return (
        String(row.state || "").trim().toUpperCase() === info.state &&
        String(row.site || "").trim().toLowerCase() === site.toLowerCase() &&
        String(row.equipmentCode || "").trim().toLowerCase() ===
          info.equipmentCode
      );
    }

    // COUNT EXISTING MATCHING RECORDS
    async function readMatchingCount(info, site) {
      const data = await getJSON("logs");

      if (!Array.isArray(data.rows)) {
        throw new Error("Unexpected logs response");
      }

      return data.rows.filter(row =>
        matchesLog(row, info, site)
      ).length;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // VERIFY RECORD AFTER SUBMISSION
    async function verifySavedLog(
      info,
      site,
      previousCount,
      startedAt
    ) {
      for (let attempt = 0; attempt < 5; attempt++) {
        if (attempt) {
          await wait(1400);
        }

        try {
          const data = await getJSON("logs");

          if (!Array.isArray(data.rows)) {
            continue;
          }

          const matching = data.rows.filter(row =>
            matchesLog(row, info, site)
          );

          if (previousCount !== null) {
            if (matching.length > previousCount) {
              return true;
            }
          } else {
            const found = matching.some(row => {
              const time = new Date(row.timestamp).getTime();

              return (
                Number.isFinite(time) &&
                time >= startedAt - 5000
              );
            });

            if (found) {
              return true;
            }
          }
        } catch (error) {
          // Retry if the spreadsheet read fails.
        }
      }

      return false;
    }

    // QR SCAN PAGE
    function showScan(code) {
      const info = parseCode(code);

      app.innerHTML = `
        <h1>Log Equipment</h1>

        <p class="sub">
          Scanned tag — confirm the site where this item is located.
        </p>

        <section class="card" id="scanCard"></section>

        <a href="${window.location.pathname}">
          ← View equipment log
        </a>
      `;

      const card = document.getElementById("scanCard");

      if (!info) {
        card.append(
          element(
            "p",
            {},
            "Unrecognized equipment code. Check the QR code and try again."
          )
        );

        return;
      }

      card.innerHTML = `
        <div class="pill">Equipment code</div>

        <div class="code" id="equipmentCode"></div>

        <div class="grid2" style="margin-top:18px">
          <div>
            <div class="pill">State</div>
            <strong id="equipmentState"></strong>
          </div>

          <div>
            <div class="pill">Equipment</div>
            <strong id="equipmentName"></strong>
          </div>
        </div>

        <form id="logForm">
          <label for="site">Site name</label>

          <input
            id="site"
            name="site"
            list="siteList"
            placeholder="e.g. Kealba Hotel"
            autocomplete="off"
            maxlength="150"
            required
          >

          <datalist id="siteList"></datalist>

          <button
            class="full"
            id="submitBtn"
            type="submit"
          >
            Submit equipment log
          </button>
        </form>

        <div
          id="message"
          hidden
          role="status"
          aria-live="polite">
        </div>
      `;

      document.getElementById("equipmentCode").textContent =
        info.equipmentCode;

      document.getElementById("equipmentState").textContent =
        info.state;

      document.getElementById("equipmentName").textContent =
        info.equipmentName;

      // LOAD EXISTING SITE SUGGESTIONS
      getJSON("sites")
        .then(data => {
          const datalist = document.getElementById("siteList");

          const sites = Array.isArray(data.sites)
            ? data.sites
            : [];

          for (const site of sites) {
            if (typeof site === "string" && site.trim()) {
              datalist.append(
                element("option", { value: site })
              );
            }
          }
        })
        .catch(() => {});

      const form = document.getElementById("logForm");

      // SUBMIT EQUIPMENT DETAILS
      form.addEventListener("submit", async event => {
        event.preventDefault();

        const site = form.elements.site.value.trim();

        if (!site) {
          form.elements.site.focus();
          return;
        }

        const button = document.getElementById("submitBtn");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Submitting…";
        message.hidden = true;

        try {
          let previousCount = null;

          try {
            previousCount = await readMatchingCount(info, site);
          } catch (error) {
            // Reading can fail due to browser CORS restrictions.
          }

          const startedAt = Date.now();

          // SEND RECORD TO GOOGLE APPS SCRIPT
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              state: info.state,
              site: site,
              equipmentName: info.equipmentName,
              equipmentCode: info.equipmentCode
            })
          });

          button.textContent = "Checking spreadsheet…";

          // VERIFY THAT GOOGLE SHEETS CONTAINS THE ENTRY
          const verified = await verifySavedLog(
            info,
            site,
            previousCount,
            startedAt
          );

          if (verified) {
            setNotice(
              message,
              "Saved successfully to Google Sheets: " +
                info.equipmentCode +
                " at " +
                site +
                ".",
              "ok"
            );
          } else {
            setNotice(
              message,
              "Submission sent, but the spreadsheet could not be verified. Check the Equipment Log or Google Sheet before submitting again to avoid duplicates.",
              "info"
            );
          }
        } catch (error) {
          setNotice(
            message,
            "Unable to send the submission. Check your connection and Google Apps Script URL. " +
              error.message,
            "error"
          );
        } finally {
          button.disabled = false;
          button.textContent = "Submit equipment log";
        }
      });
    }

    // EQUIPMENT DASHBOARD
    async function showDashboard() {
      app.innerHTML = `
        <div class="row">
          <div>
            <h1>Equipment Site Log</h1>
            <p class="sub">
              View equipment locations recorded by scanned QR tags.
            </p>
          </div>
        </div>

        <section class="card">
          <div class="row">
            <div class="pill" id="count">
              Loading entries…
            </div>

            <div class="actions">
              <button
                class="secondary"
                id="refreshBtn"
                type="button"
              >
                Refresh
              </button>

              <button
                id="exportBtn"
                type="button"
                disabled
              >
                Export to Excel
              </button>
            </div>
          </div>

          <div class="grid2">
            <div>
              <label for="stateFilter">
                Filter by state
              </label>

              <select id="stateFilter">
                <option value="">All states</option>
              </select>
            </div>

            <div>
              <label for="search">
                Search site or equipment
              </label>

              <input
                id="search"
                placeholder="Search entries…"
                type="search"
              >
            </div>
          </div>

          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>State</th>
                  <th>Site</th>
                  <th>Equipment Name</th>
                  <th>Equipment Code</th>
                  <th>Logged At</th>
                </tr>
              </thead>

              <tbody id="rows">
                <tr>
                  <td class="empty" colspan="5">
                    Loading…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div
            id="notice"
            hidden
            role="status"
            aria-live="polite">
          </div>
        </section>

        <p class="footer">
          Records are stored in the connected Google Sheet.
          This dashboard displays saved entries only.
        </p>
      `;

      const stateFilter =
        document.getElementById("stateFilter");

      for (const state of Object.values(STATES)) {
        stateFilter.append(
          element("option", { value: state }, state)
        );
      }

      const count = document.getElementById("count");
      const body = document.getElementById("rows");
      const notice = document.getElementById("notice");
      const exportBtn = document.getElementById("exportBtn");

      let records = [];

      // FILTER DATA
      function filtered() {
        const state = stateFilter.value;

        const term = document
          .getElementById("search")
          .value.trim()
          .toLowerCase();

        return records.filter(r => {
          const stateMatches =
            !state || r.state === state;

          const searchMatches =
            !term ||
            [
              r.site,
              r.equipmentName,
              r.equipmentCode,
              r.state
            ].some(value =>
              String(value || "")
                .toLowerCase()
                .includes(term)
            );

          return stateMatches && searchMatches;
        });
      }

      // DISPLAY RECORDS
      function repaint() {
        const selected = filtered();

        count.textContent =
          `${selected.length} of ${records.length} entries`;

        body.replaceChildren();

        if (!selected.length) {
          const tr = element("tr");

          const td = element(
            "td",
            {
              colspan: "5",
              class: "empty"
            },
            "No equipment entries found."
          );

          tr.append(td);
          body.append(tr);
        }

        for (const r of selected) {
          const tr = element("tr");

          const values = [
            r.state,
            r.site,
            r.equipmentName,
            r.equipmentCode,
            formatDate(r.timestamp)
          ];

          for (const value of values) {
            tr.append(
              element("td", {}, String(value ?? ""))
            );
          }

          body.append(tr);
        }

        exportBtn.disabled = !selected.length;
      }

      // REFRESH DATA FROM GOOGLE SHEETS
      async function refresh() {
        const refreshBtn =
          document.getElementById("refreshBtn");

        refreshBtn.disabled = true;
        count.textContent = "Loading entries…";
        notice.hidden = true;

        try {
          const response = await getJSON("logs");

          if (!Array.isArray(response.rows)) {
            throw new Error(
              "Unexpected spreadsheet response"
            );
          }

          records = response.rows;

          repaint();
        } catch (error) {
          records = [];

          repaint();

          setNotice(
            notice,
            "Could not load Google Sheets entries. Verify your Apps Script deployment and sheet name. Details: " +
              error.message,
            "error"
          );
        } finally {
          refreshBtn.disabled = false;
        }
      }

      // EVENT LISTENERS
      stateFilter.addEventListener(
        "change",
        repaint
      );

      document
        .getElementById("search")
        .addEventListener("input", repaint);

      document
        .getElementById("refreshBtn")
        .addEventListener("click", refresh);

      // EXPORT FILTERED ENTRIES TO EXCEL
      exportBtn.addEventListener("click", () => {
        if (typeof XLSX === "undefined") {
          setNotice(
            notice,
            "Excel export library has not loaded. Check your internet connection and reload.",
            "error"
          );
          return;
        }

        const rows = filtered().map(r => ({
          State: r.state,
          Site: r.site,
          "Equipment Name": r.equipmentName,
          "Equipment Code": r.equipmentCode,
          "Logged At": formatDate(r.timestamp)
        }));

        const sheet = XLSX.utils.json_to_sheet(rows);
        const book = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(
          book,
          sheet,
          "Equipment Log"
        );

        XLSX.writeFile(
          book,
          "le_parfait_equipment_log.xlsx"
        );
      });

      await refresh();
    }

    // INITIALIZE APPLICATION
    if (rawCode !== null) {
      showScan(rawCode);
    } else {
      showDashboard();
    }
  </script>
</body>
</html>
