<script>
/* Resolve the theme before first paint: saved choice wins, else follow the device. */
(function () {
  var saved = null;
  try {saved = localStorage.getItem("lp-theme")} catch (e) {}

  var theme = (saved === "light" || saved === "dark")
    ? saved
    : (window.matchMedia &&
       matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");

  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<script>
/* Theme toggle: flips the theme and remembers the choice. */
(function () {
  var root = document.documentElement;
  var button = document.getElementById("themeToggle");

  function paint() {
    var dark = root.getAttribute("data-theme") === "dark";
    var label = dark ? "Switch to light theme" : "Switch to dark theme";

    button.textContent = dark ? "☀" : "☾";
    button.setAttribute("aria-label", label);
    button.title = label;
  }

  button.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";

    root.setAttribute("data-theme", next);
    try {localStorage.setItem("lp-theme", next)} catch (e) {}

    paint();
  });

  paint();
})();
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
"use strict";

// GOOGLE APPS SCRIPT
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxrzrFXN-vuOITgKyJkg0E8yPbhfxGtQQZdgQnLHPRTJdAASNmGWq3zEoNG2ISGQf3m/exec";

// Supervisors available in each state.
const SUPERVISORS = {
  VIC:["Dinesh","Anish"],
  NSW:["Yomal","Charith","Uma"],
  WA:["Janitha","Madushanka","MJ"],
  QLD:["Maggie"],
  ACT:["Shelly"]
};

const STATES = {
  vic:"VIC",
  wa:"WA",
  nsw:"NSW",
  qld:"QLD",
  act:"ACT"
};

const NAMES = {
  mopbuc:"Mop Bucket",
  vac:"Vacuum Cleaner",
  winkit:"Window Kit (Squeegee, Applicator, Bucket)",
  scrub:"Scrubber",
  presswash:"Pressure Washer",
  polyvac:"Polyvac"
};

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);

// UTILITY FUNCTIONS
function el(tag,text="",className="") {
  const node=document.createElement(tag);
  node.textContent=text;
  if(className) node.className=className;
  return node;
}

function notice(node,message,type="info") {
  node.className="notice "+type;
  node.textContent=message;
  node.hidden=false;
}

function formatDate(value) {
  const date=new Date(value);
  return isNaN(date.getTime())
    ? String(value||"")
    : date.toLocaleString();
}

function wait(ms) {
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function getJSON(action) {
  const url=new URL(SCRIPT_URL);
  url.searchParams.set("action",action);
  url.searchParams.set("_",Date.now());

  const response=await fetch(url,{
    cache:"no-store"
  });

  if(!response.ok) {
    throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  if(data.success===false) {
    throw new Error(data.message||"Spreadsheet error");
  }

  return data;
}

async function postJSON(payload) {
  const response=await fetch(SCRIPT_URL,{
    method:"POST",
    // text/plain avoids a CORS preflight Apps Script cannot answer
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  });

  if(!response.ok) {
    throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  if(data.success===false) {
    throw new Error(data.message||"Spreadsheet error");
  }

  return data;
}

/** Values from the sheet are untrusted text; escape before interpolating. */
function escapeHTML(value) {
  return String(value==null?"":value).replace(
    /[&<>"']/g,
    character=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"
    })[character]
  );
}

// EQUIPMENT QR CODE PARSING
function parseCode(raw,stateParam="",equipmentParam="") {
  if(typeof raw!=="string") return null;

  const code=raw.trim().toLowerCase();
  const parts=code.split("_");

  if(
    parts.length===3 &&
    STATES[parts[0]] &&
    NAMES[parts[1]] &&
    /^\d+$/.test(parts[2])
  ) {
    return {
      state:STATES[parts[0]],
      equipmentName:NAMES[parts[1]],
      equipmentCode:code
    };
  }

  const state=String(stateParam).toUpperCase();
  const equipmentName=String(equipmentParam).trim();

  if(
    Object.values(STATES).includes(state) &&
    equipmentName &&
    equipmentName.length<=70 &&
    /^[a-z0-9_-]{3,85}$/.test(code)
  ) {
    return {
      state,
      equipmentName,
      equipmentCode:code
    };
  }

  return null;
}

function resolveQR(raw) {
  const value=String(raw||"").trim();
  if(!value) return null;

  let code=value;
  let state="";
  let equipment="";

  try {
    const url=new URL(value);

    if(
      url.protocol!=="https:" ||
      url.hostname!=="leparfait.vercel.app"
    ) return null;

    code=url.searchParams.get("code")||"";
    state=url.searchParams.get("state")||"";
    equipment=url.searchParams.get("equipment")||"";
  } catch(_) {
    // Treat input as a plain equipment code.
  }

  const info=parseCode(code,state,equipment);
  if(!info) return null;

  return {code:info.equipmentCode,state,equipment};
}

function openEquipment(info) {
  const url=new URL(location.pathname,location.origin);
  url.searchParams.set("code",info.code);

  if(info.state) url.searchParams.set("state",info.state);
  if(info.equipment) url.searchParams.set("equipment",info.equipment);

  location.assign(url.toString());
}

// EQUIPMENT HISTORY
function getHistory(rows,code) {
  return rows.filter(row=>
    String(row.equipmentCode||"")
      .trim().toLowerCase()===code.toLowerCase()
  );
}

function latestByCode(rows) {
  const map=new Map();

  for(const row of rows) {
    const code=String(row.equipmentCode||"")
      .trim().toLowerCase();

    if(code) map.set(code,row);
  }

  return [...map.values()].reverse();
}

function renderHistory(code,history) {
  const dialog=document.getElementById("historyDialog");
  const container=document.getElementById("historyBody");

  container.replaceChildren();

  const heading=el("div","","row");
  heading.append(el("strong","Scan History — "+code));

  const close=el("button","Close","secondary");
  close.onclick=()=>dialog.close();
  heading.append(close);

  container.append(heading);

  // Clicking the backdrop closes it, the same as Esc does.
  dialog.onclick=event=>{
    if(event.target===dialog) dialog.close();
  };

  if(!history.length) {
    container.append(el("p","No saved history."));
    openDialog(dialog);
    return;
  }

  container.append(
    el("p",history.length+" saved assignment(s)","pill")
  );

  const wrap=el("div","","tablewrap");
  const table=el("table");
  const head=el("thead");
  const tr=el("tr");

  ["Site","State","Logged At"].forEach(name=>
    tr.append(el("th",name))
  );

  head.append(tr);
  table.append(head);

  const body=el("tbody");

  [...history].reverse().forEach((row,index)=>{
    const tr=el("tr");

    [
      row.site,
      row.state,
      formatDate(row.timestamp)
    ].forEach(value=>tr.append(el("td",String(value||""))));

    if(index===0) tr.style.fontWeight="600";
    body.append(tr);
  });

  table.append(body);
  wrap.append(table);
  container.append(wrap);
  openDialog(dialog);
}

function openDialog(dialog) {
  if(dialog.open) return;

  if(typeof dialog.showModal==="function") {
    dialog.showModal();
  } else {
    // Very old browsers without <dialog>: fall back to a plain panel.
    dialog.setAttribute("open","");
  }
}

// DASHBOARD
async function showDashboard() {
  app.innerHTML=`
    <div class="row" style="margin-bottom:20px">
      <div>
        <h1>Equipment Sites Log</h1>
        <p class="sub" style="margin-bottom:0">
          Latest equipment locations and complete scan history.
        </p>
      </div>

      <a class="button-link" href="?view=add">
        + Add New Equipment
      </a>
    </div>

    <section class="card">
      <div class="pill" id="count">Loading entries...</div>

      <div class="grid2">
        <div>
          <label for="stateFilter">Filter by state</label>
          <select id="stateFilter">
            <option value="">All states</option>
          </select>
        </div>

        <div>
          <label for="search">Search site or equipment</label>
          <input id="search" type="search"
                 placeholder="Search entries...">
        </div>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Equipment Code</th>
              <th>State</th>
              <th>Site</th>
              <th>Equipment Name</th>
              <th>Logged At</th>
            </tr>
          </thead>

          <tbody id="rows">
            <tr>
              <td colspan="5" class="empty">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="dashboardNotice" hidden></div>
    </section>

    <p class="footer">
      Each equipment item appears once at its latest saved site.
      Click an equipment code to view its complete history.
    </p>
  `;

  const stateFilter=document.getElementById("stateFilter");
  const search=document.getElementById("search");
  const tableBody=document.getElementById("rows");
  const count=document.getElementById("count");
  const errorBox=document.getElementById("dashboardNotice");

  Object.values(STATES).forEach(state=>{
    const option=el("option",state);
    option.value=state;
    stateFilter.append(option);
  });

  let records=[];

  function filtered() {
    const state=stateFilter.value;
    const term=search.value.trim().toLowerCase();

    return latestByCode(records).filter(row=>
      (!state||row.state===state) &&
      (!term||[
        row.equipmentCode,
        row.site,
        row.equipmentName,
        row.state
      ].some(value=>
        String(value||"").toLowerCase().includes(term)
      ))
    );
  }

  function repaint() {
    const selected=filtered();
    const total=latestByCode(records).length;

    count.textContent=
      `${selected.length} of ${total} equipment items `+
      `(${records.length} total saved assignments)`;

    tableBody.replaceChildren();

    if(!selected.length) {
      const tr=el("tr");
      const td=el("td","No equipment entries found.","empty");
      td.colSpan=5;
      tr.append(td);
      tableBody.append(tr);
    }

    selected.forEach(row=>{
      const tr=el("tr");
      const codeCell=el("td");

      const codeBtn=el(
        "button",
        String(row.equipmentCode||""),
        "code-link"
      );

      codeBtn.onclick=()=>{
        renderHistory(
          String(row.equipmentCode),
          getHistory(records,String(row.equipmentCode))
        );
      };

      codeCell.append(codeBtn);
      tr.append(codeCell);

      [
        row.state,
        row.site,
        row.equipmentName,
        formatDate(row.timestamp)
      ].forEach(value=>tr.append(el("td",String(value??""))));

      tableBody.append(tr);
    });
  }

  async function refresh() {
    count.textContent="Loading entries...";
    errorBox.hidden=true;

    try {
      const response=await getJSON("logs");

      if(!Array.isArray(response.rows)) {
        throw new Error("Unexpected spreadsheet response");
      }

      records=response.rows;
      repaint();
    } catch(error) {
      records=[];
      repaint();
      notice(
        errorBox,
        "Could not load Google Sheets entries: "+error.message,
        "error"
      );
    }
  }

  stateFilter.onchange=repaint;
  search.oninput=repaint;

  await refresh();
}

// CAMERA SCANNER
function setupCameraScanner() {
  const open=document.getElementById("openScanner");
  const close=document.getElementById("closeScanner");
  const panel=document.getElementById("cameraPanel");
  const status=document.getElementById("cameraStatus");
  const manual=document.getElementById("manualQR");
  const manualBtn=document.getElementById("manualQRBtn");
  const message=document.getElementById("scannerMessage");

  let scanner=null;
  let scanning=false;
  let processing=false;

  function scanResult(text) {
    if(processing) return;

    const result=resolveQR(text);

    if(!result) {
      notice(
        message,
        "Unrecognized QR code. Please scan a Le Parfait equipment code.",
        "error"
      );
      return;
    }

    processing=true;

    if(status) status.textContent="Equipment found...";

    if(scanner&&scanning) {
      scanner.stop()
        .catch(()=>{})
        .finally(()=>openEquipment(result));
    } else {
      openEquipment(result);
    }
  }

  async function stopScanner() {
    if(scanner&&scanning) {
      try {await scanner.stop()} catch(_) {}
      scanning=false;
    }

    try {scanner?.clear()} catch(_) {}

    scanner=null;
    panel.hidden=true;
    open.hidden=false;
  }

  open.onclick=async()=>{
    panel.hidden=false;
    open.hidden=true;
    message.hidden=true;
    status.textContent="Requesting camera permission...";

    if(!window.isSecureContext) {
      status.textContent="Camera requires HTTPS.";
      return;
    }

    if(typeof Html5Qrcode==="undefined") {
      status.textContent="Scanner library unavailable.";
      return;
    }

    try {
      scanner=new Html5Qrcode(
        "scannerPreview",
        {verbose:false}
      );

      await scanner.start(
        {facingMode:"environment"},
        {
          fps:10,
          qrbox:{width:220,height:220}
        },
        scanResult,
        ()=>{}
      );

      scanning=true;
      status.textContent="Point the camera at an equipment QR code.";
    } catch(error) {
      status.textContent=
        "Unable to start camera: "+String(error.message||error);

      try {scanner?.clear()} catch(_) {}
      scanner=null;
    }
  };

  close.onclick=stopScanner;
  manualBtn.onclick=()=>scanResult(manual.value);

  manual.onkeydown=event=>{
    if(event.key==="Enter") scanResult(manual.value);
  };

  window.addEventListener(
    "pagehide",
    ()=>{
      if(scanner&&scanning) {
        scanner.stop().catch(()=>{});
      }
    },
    {once:true}
  );
}

// VERIFY A NEW SHEET RECORD
async function verifySave(info,site,previousCount) {
  for(let i=0;i<5;i++) {
    if(i>0) await wait(1400);

    try {
      const data=await getJSON("logs");
      if(!Array.isArray(data.rows)) continue;

      const matches=data.rows.filter(row=>
        String(row.equipmentCode||"").toLowerCase()===
          info.equipmentCode &&
        String(row.site||"").trim().toLowerCase()===
          site.toLowerCase()
      );

      if(matches.length>previousCount) return true;
    } catch(_) {}
  }

  return false;
}

async function showScan() {
  const info=parseCode(

    </div>

             name="site"

             maxlength="150"
             autocomplete="off"

      <button class="full" id="submitBtn" type="submit">

      </button>
    </form>

  `;

  document.getElementById("equipmentCode").textContent=
    info.equipmentCode;
  document.getElementById("equipmentState").textContent=
    info.state;
  document.getElementById("equipmentName").textContent=
    info.equipmentName;

  const assignment=document.getElementById("currentSite");
  const form=document.getElementById("logForm");
  const message=document.getElementById("message");
  const button=document.getElementById("submitBtn");

  let currentSite="";
  let assignmentLoaded=false;
  let history=[];

  function displayAssignment() {
    assignment.replaceChildren();

    if(!history.length) {
      assignment.append(
        el("p","This equipment is not yet assigned.")
      );
      return;
    }

    const latest=history[history.length-1];

    assignment.append(
      el("span","Currently assigned to","pill"),
      el("strong",String(latest.site||"")),
      el(
        "span",
        "Last logged: "+formatDate(latest.timestamp),
        "pill"
      )
    );

    const historyBtn=el(
      "button",
      "View Scan History ("+history.length+")",
      "secondary"
    );

    historyBtn.style.marginTop="12px";

    historyBtn.onclick=()=>{
      renderHistory(
        info.equipmentCode,
        history
      );
    };

    assignment.append(historyBtn);
  }

  try {
    const data=await getJSON("logs");

    if(!Array.isArray(data.rows)) {
      throw new Error("Invalid response");
    }

    history=getHistory(data.rows,info.equipmentCode);
    assignmentLoaded=true;

    if(history.length) {
      currentSite=String(
        history[history.length-1].site||""
      ).trim();

      form.elements.site.value=currentSite;
    }

    displayAssignment();
  } catch(error) {
    assignment.textContent=
      "Could not load current assignment: "+error.message;
  }

  getJSON("sites").then(data=>{
    const list=document.getElementById("siteList");

    for(const site of (data.sites||[])) {
      if(typeof site==="string") {
        const option=el("option");
        option.value=site;
        list.append(option);
      }
    }
  }).catch(()=>{});

  form.onsubmit=async event=>{
    event.preventDefault();

    const site=form.elements.site.value.trim();

    if(!assignmentLoaded) {
      notice(
        message,
        "Cannot verify the current assignment. Check the spreadsheet connection.",
        "error"
      );
      return;
    }

    if(!site) return;

    if(
      currentSite &&
      currentSite.toLowerCase()===site.toLowerCase()
    ) {
      notice(
        message,
        "This equipment is already assigned to "+currentSite+
        ". Enter another site to record a transfer.",
        "info"
      );
      return;
    }

    button.disabled=true;
    button.textContent="Submitting...";
    message.hidden=true;

    try {
      const previousData=await getJSON("logs");
      const previousCount=previousData.rows.filter(row=>
        String(row.equipmentCode||"").toLowerCase()===
          info.equipmentCode &&
        String(row.site||"").trim().toLowerCase()===
          site.toLowerCase()
      ).length;

      await fetch(SCRIPT_URL,{
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          state:info.state,
          site,
          equipmentName:info.equipmentName,
          equipmentCode:info.equipmentCode
        })
      });

      button.textContent="Verifying...";

      const verified=await verifySave(
        info,
        site,
        previousCount
      );

      if(verified) {
        currentSite=site;

        const updated=await getJSON("logs");
        history=getHistory(updated.rows,info.equipmentCode);

        displayAssignment();

        notice(
          message,
          "Equipment successfully assigned to "+site+".",
          "ok"
        );
      } else {
        notice(
          message,
          "Submission sent, but the spreadsheet could not be verified. Check Google Sheets before submitting again.",
          "info"
        );
      }
    } catch(error) {
      notice(
        message,
        "Submission could not be completed: "+error.message,
        "error"
      );
    } finally {
      button.disabled=false;
      button.textContent="Save Site Assignment";
    }
  };
}

    return records.filter(row=>{
      if(state&&row.state!==state) return false;

      if(term) {

  function fillSupervisors() {
    const current=supervisorFilter.value;

    // The roster, plus anyone on a record who isn't on it (imported data).
    const roster=Object.values(SUPERVISORS).flat();

    const names=roster
      .concat(records.map(row=>row.supervisor))

      ? selected.length||1

    const pages=Math.max(1,Math.ceil(selected.length/size));
    if(page>pages) page=pages;

    const start=(page-1)*size;

    tableBody.replaceChildren();

    countEl.textContent=

    const activeFilters=[stateFilter.value,supervisorFilter.value,

          .forEach(value=>tr.append(el("td",String(value||""))));

        tableBody.append(tr);

    pageLabel.textContent=selected.length
      ? "Showing "+(start+1)+"-"+Math.min(start+size,selected.length)+

      : "Nothing to show";

    prevBtn.disabled=page<=1;
    nextBtn.disabled=page>=pages;

      records=(data.sites||[]).sort((a,b)=>
        String(a.site||"").localeCompare(String(b.site||""),undefined,

      );

      fillSupervisors();
      repaint();

        : ""}

      <button class="full" id="impConfirm"${usable.length?"":" disabled"}>
        Import ${usable.length} Site(s)
      </button>

      <div id="impNotice" hidden></div>
    `;

    document.getElementById("impCancel").onclick=()=>dialog.close();
    dialog.onclick=event=>{
      if(event.target===dialog) dialog.close();
    };

    document.getElementById("impConfirm").onclick=async()=>{
      const button=document.getElementById("impConfirm");
      button.disabled=true;
      button.textContent="Importing...";

      try {
        const result=await postJSON({
          type:"site",
          op:"bulk",
          rows:usable
        });

        dialog.close();
        await refresh();

        const parts=[result.added+" site(s) imported"];
        if(result.skippedDuplicate) {
          parts.push(result.skippedDuplicate+" already on the list");
        }
        if(result.skippedBlank) {
          parts.push(result.skippedBlank+" row(s) had no site name");
        }

        notice(errorBox,parts.join(", ")+".","ok");
      } catch(error) {
        notice(
          document.getElementById("impNotice"),
          "Import failed: "+error.message,
          "error"
        );
        button.disabled=false;
        button.textContent="Import "+usable.length+" Site(s)";
      }
    };

    openDialog(dialog);
  }

  /* The spreadsheet parser is ~400KB, so it is only fetched if someone
     actually imports a file. */
  function loadSheetLibrary() {
    if(window.XLSX) return Promise.resolve();

    if(!window.__xlsxLoading) {
      window.__xlsxLoading=new Promise((resolve,reject)=>{
        const tag=document.createElement("script");
        tag.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
        tag.onload=resolve;
        tag.onerror=()=>reject(new Error("could not load the spreadsheet reader"));
        document.head.append(tag);
      });
    }

    return window.__xlsxLoading;
  }

  // Accepts "Site Name" / "site", "Still Operating" / "operating", etc.
  const IMPORT_FIELDS={
    site:["site name","site","name"],
    state:["state"],
    supervisor:["supervisor","supervisor assigned","manager"],
    suburb:["suburb","location"],
    operating:["still operating","operating","active","status"],
    remarks:["remarks","notes","comment","comments"]
  };

  function mapImportRow(raw) {
    const lower={};
    Object.keys(raw).forEach(key=>{
      lower[String(key).trim().toLowerCase()]=raw[key];
    });

    const pick=names=>{
      for(const name of names) {
        if(lower[name]!==undefined&&lower[name]!==null) {
          return String(lower[name]).trim();
        }
      }
      return "";
    };

    const operatingRaw=pick(IMPORT_FIELDS.operating).toLowerCase();

    return {
      site:pick(IMPORT_FIELDS.site),
      state:pick(IMPORT_FIELDS.state).toUpperCase(),
      supervisor:pick(IMPORT_FIELDS.supervisor),
      suburb:pick(IMPORT_FIELDS.suburb),
      // Anything explicitly negative is No; blank defaults to Yes.
      operating:["no","n","false","0","closed","inactive"].includes(operatingRaw)
        ? "No"
        : "Yes",
      remarks:pick(IMPORT_FIELDS.remarks)
    };
  }

  const fileInput=document.getElementById("importFile");

  document.getElementById("importBtn").onclick=()=>fileInput.click();

  fileInput.onchange=async()=>{
    const file=fileInput.files&&fileInput.files[0];
    if(!file) return;

    errorBox.hidden=true;

    try {
      await loadSheetLibrary();

      const buffer=await file.arrayBuffer();
      const book=XLSX.read(buffer,{type:"array"});
      const first=book.Sheets[book.SheetNames[0]];

      if(!first) throw new Error("that file has no sheets");

      const raw=XLSX.utils.sheet_to_json(first,{defval:""});

      if(!raw.length) {
        throw new Error("no rows found below the header row");
      }

      const parsed=raw.map(mapImportRow);

      if(!parsed.some(row=>row.site)) {
        throw new Error(
          'no "Site Name" column found - the first row must be headers'
        );
      }

      openImportPreview(parsed,file.name);
    } catch(error) {
      notice(errorBox,"Could not read that file: "+error.message,"error");
    } finally {
      // Let the same file be chosen again after a correction.
      fileInput.value="";
    }
  };

  document.getElementById("addSiteBtn").onclick=()=>openSiteForm(null);

  // Any filter change returns to the first page, or you land on an empty one.
  [stateFilter,supervisorFilter,operatingFilter].forEach(control=>{
    control.onchange=()=>{ page=1; repaint(); };
  });

  function runSearch() {
    term=search.value.trim().toLowerCase();
    page=1;
    repaint();
  }

  searchBtn.onclick=runSearch;

  search.onkeydown=event=>{
    if(event.key==="Enter") {
      event.preventDefault();
      runSearch();
    }
  };

  // Clearing the box with the native "x" should restore the full list.
  search.onsearch=()=>{
    if(!search.value.trim()&&term) runSearch();
  };

  toggleBtn.onclick=()=>{
    const open=filterPanel.hidden;
    filterPanel.hidden=!open;
    toggleBtn.setAttribute("aria-expanded",String(open));
  };

  pageSizeSelect.onchange=()=>{ page=1; repaint(); };

  prevBtn.onclick=()=>{ page--; repaint(); };
  nextBtn.onclick=()=>{ page++; repaint(); };

  clearBtn.onclick=()=>{
    stateFilter.value="";
    supervisorFilter.value="";
    operatingFilter.value="";
    search.value="";
    term="";
    page=1;
    repaint();
  };

  Object.values(STATES).forEach(state=>{
    const option=el("option",state);
    option.value=state;
    stateFilter.append(option);
  });

  await refresh();
}

// APP ROUTING
function markNav(view) {
  document.querySelectorAll("#nav a").forEach(link=>{
    link.classList.toggle(
      "active",
      link.getAttribute("data-view")===view
    );
  });
}

if(params.has("code")) {
  markNav("equipment");
  showScan();
} else if(params.get("view")==="add") {
  markNav("equipment");
  showAddEquipment();
} else if(params.get("view")==="sites") {
  markNav("sites");
  showSitesList();
} else if(params.get("view")==="equipment") {
  markNav("equipment");
  showDashboard();
} else {
  markNav("home");
  showHome();
}
</script>
</body>
